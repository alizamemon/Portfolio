<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131318"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6f135"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c6f135" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c6f135" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <circle cx="150" cy="120" r="180" fill="url(#glow1)"/>
  <circle cx="650" cy="400" r="200" fill="url(#glow2)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.06">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="133" y1="0" x2="133" y2="500"/>
    <line x1="266" y1="0" x2="266" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="533" y1="0" x2="533" y2="500"/>
    <line x1="666" y1="0" x2="666" y2="500"/>
  </g>

  <!-- route path -->
  <path d="M 90 380 Q 260 380 300 260 T 520 180 Q 620 150 700 200" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- route nodes -->
  <circle cx="90" cy="380" r="7" fill="#c6f135"/>
  <circle cx="300" cy="260" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="520" cy="180" r="6" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="700" cy="200" r="9" fill="#8b5cf6"/>

  <!-- truck icon -->
  <g transform="translate(330,300)">
    <rect x="0" y="14" width="90" height="46" rx="6" fill="#191921" stroke="#c6f135" stroke-opacity="0.5"/>
    <path d="M90 26 H130 L150 50 V60 H90 Z" fill="#191921" stroke="#8b5cf6" stroke-opacity="0.6"/>
    <circle cx="34" cy="66" r="12" fill="#0a0a0c" stroke="#c6f135" stroke-width="2"/>
    <circle cx="122" cy="66" r="12" fill="#0a0a0c" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="12" y="26" width="30" height="20" rx="2" fill="#c6f135" fill-opacity="0.25"/>
  </g>

  <!-- pin markers -->
  <g fill="#c6f135">
    <path d="M600 300 a14 14 0 1 1 0.01 0 Z" fill-opacity="0.15"/>
  </g>
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="15" letter-spacing="4" fill="#c6f135" fill-opacity="0.8">LOGISTICS &amp; FLEET</text>
</svg>
